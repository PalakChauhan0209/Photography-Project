<!DOCTYPE html>
<html>
<head>
    <title>Photography Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Photography Portfolio</h1>
        <p>Showcasing My Best Photos</p>
    </header>

    <!-- Nature Album -->
    <section>
        <h2>Nature Album</h2>
        <div class="gallery">
            <img src="img/Nature1.jpg" alt="Nature">
            <img src="img/Nature2.jpg" alt="Nature">
        </div>
    </section>

    <!-- Wildlife Album -->
    <section>
        <h2>Wildlife Album</h2>
        <div class="gallery">
            <img src="img/Wildlife 1.jpg" alt="Wildlife">
            <img src="img/Wildlife 2.jpg" alt="Wildlife">
        </div>
    </section>

    <!-- Travel Album -->
    <section>
        <h2>Travel Album</h2>
        <div class="gallery">
            <img src="img/Travel1.jpg" alt="Travel">
            <img src="img/Travel2.jpg" alt="Travel">
        </div>
    </section>

    <!-- Portrait Album -->
    <section>
        <h2>Portrait Album</h2>
        <div class="gallery">
            <img src="img/Portrait1.jpg" alt="Portrait">
            <img src="img/Portrait2.jpg" alt="Portrait">
        </div>
    </section>

</body>
</html>
